function parisDate(d){ try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(d||new Date()); }catch(_){ return (d||new Date()).toISOString().slice(0,10); } }
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function dailyLetter(date){
  const pick=dt=>DAILY_LETTERS[hash('footletter:'+dt)%DAILY_LETTERS.length];
  let l=pick(date);
  const y=parisDate(new Date(new Date(date+'T12:00:00Z').getTime()-86400000));
  if(l===pick(y)) l=DAILY_LETTERS[(DAILY_LETTERS.indexOf(l)+1)%DAILY_LETTERS.length];
  return l.toUpperCase();
}
function msToParisMidnight(){
  try{ const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()); const g=k=>+p.find(x=>x.type===k).value; return (86400-(g('hour')*3600+g('minute')*60+g('second')))*1000; }catch(_){ return 0; }
}
function fmtHMS(ms){ const s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'min'; }
function dailyState(){ return lsGet('fl_d5_'+parisDate())||null; }
function renderDailyBadge(){
  const b=$('dailyBadge'), st=dailyState();
  b.hidden=false;
  if(st&&st.done) b.textContent=t('daily_played',{n:t('res_daily',{n:st.n})});
  else if(st&&st.s==='start') b.textContent=t('daily_interrupted');
  else b.textContent=t('daily_new');
}
function fillBoard(ul,list,k,meName,opts){
  ul.replaceChildren();
  if(!list||!list.length){ ul.append(el('li','empty',t('board_empty'))); return; }
  const me=norm(meName||'');
  list.slice(0,(opts&&opts.max)||50).forEach((e,i)=>{
    const li=el('li'); if(me&&norm(e.n)===me) li.className='me';
    li.append(el('span','rk',String(i+1)));
    const n=el('span','n',e.n); li.append(n);
    const v=el('span','v');
    if(k==='daily'){ v.textContent=e.s; v.append(el('small',null,fmtDur(e.t))); }
    else if(k==='defi'){ v.textContent=e.s; v.append(el('small',null,fmtDur(e.t))); }
    else { v.textContent=fmtDur(e.t); v.append(el('small',null,t('v_jokers',{n:e.s}))); }
    li.append(v); ul.append(li);
  });
}

const Solo=(function(){
  let R=null, tick=null;
  const M={};
  const PER=30000, DAILY_MS=180000, ABC_PEN=15000;
  function active(){ return !!(R&&R.started&&!R.over); }
  function curLetter(){ return R.mode==='abc'?R.letters[R.i]:R.letter; }
  function setHeader(){
    $('soloMode').textContent=t('m_'+R.mode);
    $('soloInfo').textContent=R.mode==='daily'?parisDate():R.mode==='defi'?t('letter')+' '+(R.letter||'?'):('A → Z · '+R.letters.length);
  }
  function intro(mode){
    stop();
    R={mode,found:[],keys:new Set(),pend:0,y:0,started:false,over:false,bet:lsGet('fl_bet')||10};
    if(mode==='daily'){ R.date=parisDate(); R.letter=dailyLetter(R.date); }
    if(mode==='defi'){ R.letter=DRAW_LETTERS[Math.floor(Math.random()*DRAW_LETTERS.length)].toUpperCase(); }
    if(mode==='abc'){ R.letters=DRAW_LETTERS.map(x=>x.toUpperCase()); R.i=0; R.jokers=3; R.pen=0; R.marks=[]; }
    show('solo');
    $('soloIntro').hidden=false; $('soloPlay').hidden=true; $('soloEnd').hidden=true;
    renderIntro();
  }
  function renderIntro(){
    setHeader();
    const m=R.mode;
    $('introTitle').textContent=t('m_'+m);
    $('introText').textContent=t(m+'_intro');
    $('introLetterWrap').hidden=m!=='defi'; $('betWrap').hidden=m!=='defi'; $('abcPreview').hidden=m!=='abc';
    $('introNote').textContent='';
    $('soloGo').textContent=t(m+'_go'); $('soloGo').disabled=false;
    if(m==='defi'){ $('introLetter').textContent=R.letter; $('betVal').textContent=R.bet; renderPresets(); }
    if(m==='abc'){ const s=$('abcPreview'); s.replaceChildren(); R.letters.forEach(l=>s.append(el('span',null,l))); }
    if(m==='daily'){
      const st=dailyState();
      if(st&&st.done){ $('soloGo').disabled=true; $('introNote').textContent=t('daily_done',{n:t('res_daily',{n:st.n})})+' '+t('next_letter',{h:fmtHMS(msToParisMidnight())}); }
      else if(st&&st.s==='start'){ $('soloGo').disabled=true; $('introNote').textContent=t('daily_interrupted')+' '+t('next_letter',{h:fmtHMS(msToParisMidnight())}); }
    }
    loadBoard($('introBoard'),$('introBoardTitle'));
  }
  function boardKey(){ return R.mode==='daily'?R.date:R.mode==='defi'?R.letter.toLowerCase():'all'; }
  function boardTitle(){ const st=dailyState(); return R.mode==='daily'?t('daily_board')+' · '+(st&&st.done?R.letter:t('hidden_letter')):R.mode==='defi'?t('defi_board',{L:R.letter}):t('abc_board'); }
  async function loadBoard(ul,title){
    title.textContent=boardTitle();
    ul.replaceChildren(el('li','empty','…'));
    const mode=R.mode, key=boardKey(), res=await LB.read(mode,key);
    if(!R||R.mode!==mode||boardKey()!==key) return;
    if(res.off&&!res.list.length){ ul.replaceChildren(el('li','empty',t('board_off'))); return; }
    fillBoard(ul,res.list,mode,myNick(),{max:15});
  }
  function renderPresets(){ const b=$('betPresets'); b.replaceChildren(); [5,10,15,20,30].forEach(v=>{ const x=el('button','btn small'+(R.bet===v?' primary':''),String(v)); x.type='button'; x.addEventListener('click',()=>{ R.bet=v; $('betVal').textContent=v; renderPresets(); }); b.append(x); }); }
  $('betMinus').addEventListener('click',()=>{ if(!R) return; R.bet=Math.max(1,R.bet-1); $('betVal').textContent=R.bet; renderPresets(); });
  $('betPlus').addEventListener('click',()=>{ if(!R) return; R.bet=Math.min(99,R.bet+1); $('betVal').textContent=R.bet; renderPresets(); });
  $('rerollBtn').addEventListener('click',()=>{ if(!R||R.started) return; let l; do{ l=DRAW_LETTERS[Math.floor(Math.random()*DRAW_LETTERS.length)].toUpperCase(); }while(l===R.letter&&DRAW_LETTERS.length>1); R.letter=l; rollLetter($('introLetter'),l,false); setHeader(); loadBoard($('introBoard'),$('introBoardTitle')); });
  $('soloGo').addEventListener('click',()=>{ if(!R||R.started) return; if(!requireNick()) return; start(); });
  $('soloBack').addEventListener('click',goHome);
  $('sQuit').addEventListener('click',()=>{ if(active()) finish(false,'quit'); });
  $('sJoker').addEventListener('click',()=>{ if(active()&&R.mode==='abc'&&R.jokers>0&&!R.pend) useJoker(); });

  function start(){
    R.started=true; R.nick=myNick();
    if(R.mode==='defi') lsSet('fl_bet',R.bet);
    if(R.mode==='daily') lsSet('fl_d5_'+R.date,{s:'start'});
    $('soloIntro').hidden=true; $('soloPlay').hidden=false; $('soloEnd').hidden=true;
    $('sFeed').replaceChildren(el('li','empty',t('none_yet'))); $('sCount').textContent='0';
    $('sFeedback').textContent=''; $('sPending').textContent=''; $('sAnswer').value='';
    $('sStrip').hidden=R.mode!=='abc'; $('sJoker').hidden=R.mode!=='abc';
    $('sAnswer').disabled=true; $('sSend').disabled=true;
    Object.keys(RING).forEach(k=>{ if(k==='s') delete RING[k]; });
    renderProgress();
    const L=curLetter();
    const go=()=>{
      if(!R||R.over) return;
      R.t0=Date.now(); R.deadline=R.t0+(R.mode==='daily'?DAILY_MS:PER); R.lastOk=R.t0;
      $('sAnswer').disabled=false; $('sSend').disabled=false; $('sAnswer').placeholder=t('ph_mine',{L:curLetter()});
      try{ $('sAnswer').focus({preventScroll:true}); }catch(_){ }
      tick=setInterval(step,100);
    };
    beep('whistle');
    if(R.mode==='abc'){ $('sLetter').textContent=L; go(); }
    else rollLetter($('sLetter'),L,R.mode==='defi',go);
  }
  function renderProgress(){
    const p=$('sProgress');
    if(R.mode==='daily') p.textContent=t('prog_daily',{n:R.found.length});
    else if(R.mode==='defi') p.textContent=t('prog_defi',{f:R.found.length,t:R.bet});
    else{
      p.textContent=t('prog_abc',{i:Math.min(R.i,R.letters.length),n:R.letters.length});
      const s=$('sStrip'); s.replaceChildren();
      R.letters.forEach((l,i)=>{ const x=el('span',R.marks[i]==='ok'?'done':R.marks[i]==='skip'?'skip':i===R.i?'cur':null,l); s.append(x); });
      $('sJoker').textContent=t('joker',{n:R.jokers}); $('sJoker').disabled=R.jokers<=0;
    }
    $('sCount').textContent=R.found.length;
  }
  function step(){
    if(!R||R.over||!R.t0) return;
    const now=Date.now();
    if(now<R.deadline) return;
    if(R.pend>0){ if(!R.waitUntil) R.waitUntil=now+6000; if(now<R.waitUntil) return; }
    R.waitUntil=0;
    if(R.mode==='daily') return finish(true);
    if(R.mode==='defi') return finish(false);
    if(R.jokers>0) return useJoker();
    finish(false);
  }
  function useJoker(){
    R.jokers--; R.pen+=ABC_PEN; R.marks[R.i]='skip'; R.i++;
    toast(t('joker',{n:R.jokers}));
    nextAbc();
  }
  function nextAbc(){
    if(R.i>=R.letters.length) return finish(true);
    R.deadline=Date.now()+PER; delete RING.s;
    $('sLetter').textContent=R.letters[R.i]; $('sAnswer').placeholder=t('ph_mine',{L:R.letters[R.i]});
    renderProgress();
  }
  function accept(display,keys,L){
    keys.forEach(k=>R.keys.add(k));
    const ms=Date.now()-R.t0;
    R.found.push({name:display,ms,L}); R.lastOk=Date.now();
    beep('ok');
    $('sFeedback').className='feedback ok'; $('sFeedback').textContent='✓ '+display;
    const fd=$('sFeed'); if(R.found.length===1) fd.replaceChildren();
    fd.prepend(feedRow(display,(R.mode==='abc'?L+' · ':'')+fmtDur(ms),null,true));
    showSticker($('sStage'),display,'+1',null);
    if(R.mode==='defi'){ R.deadline=Date.now()+PER; delete RING.s; if(R.found.length>=R.bet){ renderProgress(); return finish(true); } }
    if(R.mode==='abc'){ R.marks[R.i]='ok'; R.i++; renderProgress(); return nextAbc(); }
    renderProgress();
  }
  function rejectMsg(o){ beep('bad'); $('sFeedback').className='feedback bad'; $('sFeedback').textContent=o; }
  $('sForm').addEventListener('submit',ev=>{
    ev.preventDefault();
    if(!active()||!R.t0) return;
    const txt=$('sAnswer').value.trim(); if(!txt) return;
    const L=curLetter();
    if(R.mode==='abc'&&R.pend) return;
    const r=checkLocal(txt,L,R.keys);
    $('sAnswer').value='';
    if(r.st==='ok') return accept(r.display,r.keys,L);
    if(r.st==='bad') return rejectMsg(t('r_'+r.c,{x:r.x||'',L}));
    R.pend++; updPending(txt);
    if(R.mode==='abc'){ $('sAnswer').disabled=true; $('sSend').disabled=true; }
    const idx=R.i, runRef=R;
    resolveRemote(txt,L,R.keys).then(res=>{
      if(R!==runRef) return;
      R.pend--; updPending();
      if(R.mode==='abc'&&!R.over){ $('sAnswer').disabled=false; $('sSend').disabled=false; try{ $('sAnswer').focus({preventScroll:true}); }catch(_){ } }
      if(R.over) return;
      if(R.mode==='abc'&&R.i!==idx) return;
      if(res.st==='ok') return accept(res.display,res.keys,L);
      if(res.st==='bad') return rejectMsg(t('r_'+res.c,{x:res.x||'',L}));
      rejectMsg(res.off?t('r_offline',{x:titleCase(txt)}):t('r_unknown',{x:titleCase(txt)}));
    });
  });
  function updPending(txt){ $('sPending').textContent=R.pend>0?t('checking',{x:txt||'…'}):''; }
  function foul(){
    if(!active()) return;
    R.y++;
    beep('card');
    if(R.y>=2){ R.dq=true; finish(false,'dq'); }
    else toast(t('my_yellow'),'yellow');
  }
  async function finish(ok,why){
    if(R.over) return;
    R.over=true; clearInterval(tick); tick=null;
    $('sAnswer').disabled=true; $('sSend').disabled=true;
    const run=R, n=run.found.length, total=Date.now()-(run.t0||Date.now());
    let entry=null;
    if(run.mode==='daily'&&!run.dq&&why!=='quit'){ entry={n:run.nick,s:n,t:n?run.found[n-1].ms:0,d:Date.now(),i:rid(8)}; }
    if(run.mode==='defi'&&ok&&!run.dq) entry={n:run.nick,s:run.bet,t:total,d:Date.now(),i:rid(8)};
    if(run.mode==='abc'&&ok&&!run.dq) entry={n:run.nick,s:3-run.jokers,t:total+run.pen,d:Date.now(),i:rid(8)};
    run.total=total; run.ok=ok; run.why=why; run.entry=entry;
    if(run.mode==='daily') lsSet('fl_d5_'+run.date,{s:'done',done:1,n:run.dq||why==='quit'?0:n,list:run.found.map(x=>x.name)});
    if(ok) beep('win'); else beep('whistle');
    show('solo'); $('soloIntro').hidden=true; $('soloPlay').hidden=true; $('soloEnd').hidden=false;
    renderEnd();
    $('eRank').textContent=entry?t('saving'):(run.dq?t('dq'):t('not_ranked'));
    $('eBoard').replaceChildren(el('li','empty','…'));
    $('eBoardTitle').textContent=boardTitle();
    const key=boardKey();
    const res=entry?await LB.submit(run.mode,key,entry):await LB.read(run.mode,key);
    if(R!==run) return;
    run.board=res;
    renderEndBoard();
  }
  function renderEndBoard(){
    const run=R, res=run.board; if(!res) return;
    $('eBoardTitle').textContent=boardTitle();
    if(res.off&&!res.list.length){ $('eBoard').replaceChildren(el('li','empty',t('board_off'))); }
    else fillBoard($('eBoard'),res.list,run.mode,run.nick,{max:20});
    if(run.entry){ const i=res.list.findIndex(e=>norm(e.n)===norm(run.nick)); $('eRank').textContent=res.off?t('board_off'):(i>=0?t('rank',{r:i+1,n:res.list.length}):t('not_ranked')); }
  }
  function renderEnd(){
    const run=R, n=run.found.length;
    setHeader();
    if(run.dq){ $('eLabel').textContent=t('dq_label'); $('eTitle').textContent=t('dq'); $('eTitle').style.color='var(--red)'; }
    else if(run.mode==='daily'){ $('eLabel').textContent=t('m_daily'); $('eTitle').textContent=t('res_daily',{n}); $('eTitle').style.color=''; }
    else if(run.mode==='defi'){ $('eLabel').textContent=t('m_defi'); $('eTitle').textContent=run.ok?t('res_defi_ok'):t('res_defi_ko'); $('eTitle').style.color=run.ok?'var(--go)':'var(--red)'; }
    else { $('eLabel').textContent=run.ok?t('res_abc_label'):t('m_abc'); $('eTitle').textContent=run.ok?fmtDur(run.total+run.pen):t('res_abc_ko'); $('eTitle').style.color=run.ok?'var(--go)':'var(--red)'; }
    $('eSub').textContent=run.mode==='daily'?t('res_daily_sub',{L:run.letter,d:run.date}):run.mode==='defi'?t('res_defi_sub',{f:n,t:run.bet,L:run.letter}):t('res_abc_sub',{n:run.marks.filter(x=>x==='ok').length,j:3-run.jokers});
    $('eAgain').hidden=run.mode==='daily';
    $('eShare').hidden=!!run.dq;
    foundChips($('eFound'),run.found.map(f=>[0,f.name]),null);
    if(run.board) renderEndBoard();
  }
  $('eAgain').addEventListener('click',()=>{ if(R) intro(R.mode); });
  $('eBoards').addEventListener('click',()=>{ const m=R?R.mode:'daily', L=R&&R.letter; Boards.open(m,L&&L.toLowerCase()); });
  $('eShare').addEventListener('click',()=>{
    if(!R) return;
    const n=R.found.length, url=location.protocol==='file:'?'':location.href.split('#')[0];
    let txt='FOOT LETTER · ';
    if(R.mode==='daily') txt+=t('m_daily')+' '+R.date+' · '+R.letter+' · '+t('res_daily',{n})+' ⚽';
    else if(R.mode==='defi') txt+=t('m_defi')+' '+R.letter+' · '+n+'/'+R.bet+(R.ok?' ✅':' ❌');
    else txt+=t('m_abc')+' · '+(R.ok?fmtDur(R.total+R.pen)+' ⏱️':t('res_abc_ko'));
    shareOrCopy('FOOT LETTER',txt,url,t('copied'));
  });
  function frame(){
    if(!R||!R.started||R.over||!R.t0||$('soloPlay').hidden) return;
    const total=R.mode==='daily'?DAILY_MS:PER;
    drawRing('s',Math.max(0,R.deadline-Date.now()),total,false);
  }
  function stop(){ clearInterval(tick); tick=null; if(R&&R.started&&!R.over&&R.mode==='daily') lsSet('fl_d5_'+R.date,{s:'start'}); if(R) R.over=true; }
  function refresh(){ if(!R) return; if(!$('soloIntro').hidden) renderIntro(); else if(!$('soloEnd').hidden) renderEnd(); else { setHeader(); renderProgress(); $('sAnswer').placeholder=t('ph_mine',{L:curLetter()}); } }
  return {intro,active,foul,frame,stop:()=>{ if(R&&R.started&&!R.over){ R.over=true; clearInterval(tick); } R=null; },refresh};
})();
$('mDaily').addEventListener('click',()=>Solo.intro('daily'));
$('mDefi').addEventListener('click',()=>Solo.intro('defi'));
$('mAbc').addEventListener('click',()=>Solo.intro('abc'));

/* ================= CLASSEMENTS ================= */
const Boards=(function(){
  let tab='daily', letter=null, data={}, loading=false;
  function open(t0,L){ Solo.stop(); tab=t0||'daily'; if(L) letter=L; show('boards'); load(); }
  async function load(){
    loading=true; render();
    if(tab==='daily'){ const r=await LB.read('daily',parisDate()); data.daily=r; }
    else if(tab==='defi'){ const all=await LB.readAll('defi'); data.defi=all; if(!letter){ const ks=all?Object.keys(all).filter(k=>all[k].length):[]; letter=ks.length?ks.sort((a,b)=>all[b].length-all[a].length)[0]:'m'; } }
    else { data.abc=await LB.read('abc','all'); }
    loading=false; render();
  }
  function render(){
    document.querySelectorAll('#bTabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));
    const ul=$('bList'), title=$('bTitle'), lt=$('bLetters');
    lt.hidden=tab!=='defi';
    if(tab==='defi'){
      lt.replaceChildren();
      const all=data.defi||{};
      DRAW_LETTERS.forEach(l=>{ const b=el('button',null,l.toUpperCase()); b.type='button'; b.setAttribute('aria-pressed',String(l===letter)); if(all[l]&&all[l].length) b.style.boxShadow='inset 0 -3px 0 var(--go)'; b.addEventListener('click',()=>{ letter=l; render(); }); lt.append(b); });
    }
    if(loading){ title.textContent=''; ul.replaceChildren(el('li','empty','…')); return; }
    const me=myNick();
    if(tab==='daily'){ const st=dailyState(); title.textContent=t('b_daily',{L:st&&st.done?dailyLetter(parisDate()):t('hidden_letter')})+' · '+parisDate(); const r=data.daily; if(!r||r.off&&!r.list.length){ ul.replaceChildren(el('li','empty',t('board_off'))); return; } fillBoard(ul,r.list,'daily',me); }
    else if(tab==='defi'){ title.textContent=t('b_defi',{L:(letter||'m').toUpperCase()}); if(!data.defi){ ul.replaceChildren(el('li','empty',t('board_off'))); return; } fillBoard(ul,data.defi[letter]||[],'defi',me); }
    else { title.textContent=t('b_abc'); const r=data.abc; if(!r||r.off&&!r.list.length){ ul.replaceChildren(el('li','empty',t('board_off'))); return; } fillBoard(ul,r.list,'abc',me); }
  }
  $('bTabs').addEventListener('click',ev=>{ const b=ev.target.closest('button[data-tab]'); if(!b) return; tab=b.dataset.tab; load(); });
  $('bRefresh').addEventListener('click',load);
  $('bBack').addEventListener('click',goHome);
  return {open,render};
})();
$('boardsBtn').addEventListener('click',()=>Boards.open('daily'));

/* ================= DÉMARRAGE ================= */
Hub.start();
applyI18n();
setInterval(()=>{ if(SCREEN==='home') renderDailyBadge(); },60000);
</script>
