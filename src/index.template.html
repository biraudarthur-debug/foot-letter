<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOOT LETTER</title>
<meta name="description" content="FOOT LETTER : une lettre, un chrono, citez un maximum de footballeurs par leur nom. Entre amis, en défi ou chaque jour face au monde entier.">
<meta property="og:title" content="FOOT LETTER">
<meta property="og:description" content="Le jeu de culture foot : une lettre, un chrono, le dernier debout gagne.">
<meta name="theme-color" content="#0a2a1e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230f3a2a'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23f1f6ef' stroke-width='4'/%3E%3Ctext x='32' y='42' font-family='Arial Black,Arial' font-weight='900' font-size='27' text-anchor='middle' fill='%23f7c948'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.wikidata.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Terrain la nuit, version arrondie : surfaces pleines aux angles doux, pastilles colorées par mode, la lettre reste la star au centre. */
:root{
  color-scheme: dark;
  --bg:#0a2a1e; --bg-2:#0c2f22; --card:#103a2b; --card-2:#144635; --sunk:#0b2c20;
  --chalk:#f1f6ef; --chalk-2:rgba(241,246,239,.72); --chalk-3:rgba(241,246,239,.4); --line:rgba(241,246,239,.11);
  --yellow:#f7c948; --red:#ef5b4c; --go:#5fd38d; --blue:#7cc4ff; --orange:#ff9f68; --purple:#b99cff; --pink:#ff86bd;
  --ink:#0a1f16; --paper:#f7f3e8;
  --r-lg:24px; --r:16px; --r-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.22);
  --f-display:"Big Shoulders Display","Oswald","Impact","Arial Narrow",sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(90% 60% at 50% -10%, rgba(241,246,239,.08), transparent 65%),repeating-linear-gradient(90deg, transparent 0 80px, rgba(255,255,255,.018) 80px 160px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:20px}
.label{font-family:var(--f-display);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;color:var(--chalk-2)}
.h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,44px);margin:0;text-transform:uppercase;line-height:.95;letter-spacing:.01em;text-wrap:balance}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px 4px 0;cursor:pointer;border-radius:12px}
.brand i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--yellow);color:var(--ink);font-style:normal;font-size:18px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--chalk-2);background:var(--card)}
.chip b{color:var(--chalk);font-family:var(--f-display);letter-spacing:.1em;font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:14.5px;color:var(--chalk-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
.seg button:disabled{cursor:default}
.seg button:not([aria-pressed="true"]):not(:disabled):hover{color:var(--chalk)}
.iconbtn{border:0;background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--chalk-2);cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1 1 200px;min-width:0}
.btn{appearance:none;border:0;background:var(--card-2);color:var(--chalk);padding:13px 24px;border-radius:999px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:17px;cursor:pointer;transition:transform .12s,background .15s,filter .15s;box-shadow:inset 0 0 0 2px var(--line)}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--yellow);color:var(--ink);box-shadow:0 6px 0 #b8901f}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #b8901f}
.btn.ghost{background:transparent;color:var(--chalk-2)}
.btn.small{padding:8px 15px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.input{background:var(--sunk);border:2px solid transparent;border-radius:var(--r-sm);padding:12px 15px;font-size:16px;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--chalk-3);outline:none}
.input::placeholder{color:var(--chalk-3)}
.note{font-size:13px;color:var(--chalk-2);margin:0}
.note.warn{color:var(--yellow)} .note.ok{color:var(--go)}
.panel{background:var(--card);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.panel.flat{box-shadow:none;background:var(--bg-2)}

/* accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center;padding-block:12px 0}
.hero h1{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.84;margin:0;font-size:clamp(64px,12vw,138px);letter-spacing:.01em}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:2px var(--chalk)}
.hero p.lede{font-size:17.5px;max-width:46ch;color:var(--chalk-2);margin:16px 0 0;text-wrap:pretty}
.hero p.lede b{color:var(--chalk)}
.pitchmark{position:relative;aspect-ratio:1;width:min(300px,100%);justify-self:center}
.pitchmark .circle{position:absolute;inset:0;border:2px solid var(--chalk-3);border-radius:50%}
.pitchmark .half{position:absolute;left:-40%;right:-40%;top:50%;border-top:2px solid var(--line)}
.pitchmark .demo{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:min(42vw,160px);line-height:1;transition:opacity .2s}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:0;border-radius:var(--r);background:var(--card-2);cursor:pointer;transition:transform .15s,background .15s;min-width:0}
.mode:hover:not(:disabled){transform:translateY(-3px);background:#185039}
.mode:active:not(:disabled){transform:scale(.98)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);margin-bottom:4px}
.mode .ic svg{width:24px;height:24px}
.mode strong{font-family:var(--f-display);font-weight:900;font-size:23px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.mode span.d{color:var(--chalk-2);font-size:13.5px}
.mode .k{position:absolute;top:16px;right:14px;font-family:var(--f-display);font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--chalk-2)}
.mode .badge{align-self:flex-start;margin-top:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--yellow)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.rules li{background:var(--bg-2);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--chalk-2)}
.rules li b{display:block;color:var(--chalk);font-family:var(--f-display);font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.netbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.leds{display:flex;gap:5px}
.led{width:9px;height:9px;border-radius:50%;background:var(--chalk-3)}
.led.on{background:var(--go);box-shadow:0 0 8px var(--go)} .led.off{background:var(--red)}

/* réglages */
.settings{display:flex;flex-direction:column;gap:14px}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.letters button{aspect-ratio:1;border:0;background:var(--sunk);border-radius:10px;font-family:var(--f-display);font-weight:900;font-size:18px;cursor:pointer}
.letters button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.letters button:disabled{cursor:default}

/* salon */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.code-big{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,12vw,92px);letter-spacing:.14em;line-height:1}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.roster li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);background:var(--sunk)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.roster .tag{margin-left:auto;font-size:11.5px;color:var(--chalk-2);font-family:var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.local-names{display:flex;flex-direction:column;gap:8px}
.local-names .r{display:flex;gap:8px}

/* partie */
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;background:var(--card);border-radius:var(--r-lg);padding:22px 16px;box-shadow:var(--shadow);min-width:0}
.ring{position:relative;width:min(300px,74vw);aspect-ratio:1;max-width:100%}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:5}
.ring .prog{fill:none;stroke:var(--chalk);stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.ring.warn .prog{stroke:var(--yellow)} .ring.danger .prog{stroke:var(--red)} .ring.paused .prog{stroke:var(--chalk-3)}
.ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.letter{font-family:var(--f-display);font-weight:900;font-size:min(40vw,156px);line-height:.9}
.letter.roll{color:var(--chalk-2)}
.clock{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ring.danger .clock{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.tries{display:flex;gap:6px;justify-content:center;min-height:12px}
.tries i{width:11px;height:11px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 0 0 2px var(--chalk-3)}
.tries i.used{background:var(--red);box-shadow:none}
.turn{text-align:center;display:flex;flex-direction:column;gap:2px}
.turn .who{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,40px);text-transform:uppercase;letter-spacing:.03em;line-height:1}
.turn .sub{color:var(--chalk-2);font-size:14px;min-height:1.4em}
form.answer{width:100%;max-width:520px;display:flex;gap:8px}
form.answer .input{font-size:18px;padding:14px 18px;min-width:0;border-radius:999px}
.feedback{min-height:22px;font-size:15px;text-align:center;max-width:520px}
.feedback.ok{color:var(--go)} .feedback.bad{color:var(--yellow)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.decide{width:100%;max-width:520px;background:var(--sunk);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:inset 0 0 0 2px var(--yellow)}
.decide p{margin:0}
.reacts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.reacts button{width:42px;height:42px;border-radius:50%;border:0;background:var(--sunk);font-size:20px;cursor:pointer;transition:transform .1s}
.reacts button:active{transform:scale(.88)}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:var(--r-lg)}
.floater{position:absolute;bottom:18%;font-size:30px;animation:rise 2.2s ease-out forwards;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
.floater small{font-size:11px;font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:var(--sunk);padding:1px 7px;border-radius:999px}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-240px);opacity:0}}
.fair{font-size:12px;color:var(--chalk-3);text-align:center}

/* vignette joueur */
.sticker{position:absolute;top:26px;left:50%;width:210px;max-width:78%;margin-left:-105px;background:var(--paper);color:var(--ink);border-radius:18px;padding:10px 10px 12px;box-shadow:0 20px 50px rgba(0,0,0,.45);z-index:5;animation:pop .4s cubic-bezier(.2,1.5,.4,1) both;text-align:center;will-change:transform,opacity;transform:rotate(-3deg)}
@media (max-width:420px){.sticker{margin-left:0;left:11%}}
.sticker.out{animation:popout .28s ease-in forwards}
@keyframes pop{from{transform:rotate(-12deg) scale(.5);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
@keyframes popout{to{transform:rotate(6deg) scale(.7);opacity:0}}
.sticker .ph{width:100%;aspect-ratio:1/1.05;border-radius:12px;background:linear-gradient(160deg,#1d5a3f,#0c3324);display:grid;place-items:center;overflow:hidden}
.sticker .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.sticker .nm{font-family:var(--f-display);font-weight:900;font-size:23px;text-transform:uppercase;line-height:1;margin-top:8px;overflow-wrap:anywhere}
.sticker .meta{display:flex;justify-content:center;align-items:center;gap:6px;font-size:12.5px;margin-top:5px;color:#3b4a40;flex-wrap:wrap;line-height:1.3}
.sticker .by{position:absolute;top:-10px;right:-10px;color:var(--ink);font-family:var(--f-display);font-weight:900;padding:4px 10px;border-radius:999px;font-size:14px;transform:rotate(8deg)}
.flag{width:21px;height:15px;border-radius:3px;object-fit:cover;flex:none;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.jersey{width:58%;height:58%}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.players li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r-sm);background:var(--sunk);transition:background .2s,box-shadow .2s}
.players li.cur{box-shadow:inset 0 0 0 2px var(--chalk)}
.players li.out{opacity:.45}
.players .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players .nm small{color:var(--chalk-2);margin-left:6px}
.players .sc{font-family:var(--f-display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.cards{display:flex;gap:4px;align-items:center}
.card{width:11px;height:15px;border-radius:3px;flex:none;display:inline-block}
.card.r{background:var(--red)} .card.y{background:var(--yellow)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:380px;overflow:auto;contain:content}
.feed li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:12px;background:#1d5a3f;display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:900;font-size:13px;flex:none}
.av img{width:100%;height:100%;object-fit:cover;object-position:top}
.feed .nm{min-width:0;display:flex;flex-direction:column}
.feed .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .nm span{color:var(--chalk-2);font-size:12px;display:flex;gap:5px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:15px}
.feed .by{color:var(--chalk-2);font-size:12.5px;text-align:right;white-space:nowrap}
.feed li.new{animation:flash 1.2s}
@keyframes flash{0%{background:rgba(95,211,141,.22)}100%{background:transparent}}
.empty{color:var(--chalk-3);font-size:14px;padding:6px 0}

/* manches / fin */
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
.tbl th{font-family:var(--f-display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;color:var(--chalk-2);text-align:right;padding:0 8px}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td{background:var(--sunk);padding:10px 8px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{border-radius:12px 0 0 12px;font-family:var(--f-display);font-weight:900;font-size:18px;text-align:center;width:40px}
.tbl td:last-child{border-radius:0 12px 12px 0}
.tbl td.nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tbl td.pts{font-family:var(--f-display);font-weight:900;font-size:19px}
.tbl td.plus{color:var(--go);font-weight:700}
.tblwrap{overflow-x:auto;margin:-6px 0}
.winner{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.92;font-size:clamp(36px,6.5vw,62px);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{border-radius:var(--r);padding:12px 10px;text-align:center;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.pod .pos{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1}
.pod .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .p{font-family:var(--f-display);font-weight:800;font-size:16px}
.pod.g1{background:var(--yellow);min-height:150px} .pod.g2{background:#d9e1dc;min-height:120px} .pod.g3{background:#e2a46c;min-height:100px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.award{background:var(--sunk);border-radius:var(--r);padding:12px 14px;min-width:0}
.award b{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.award span{font-size:12px;color:var(--chalk-2)}
.found{display:flex;flex-wrap:wrap;gap:6px}
.found span{background:var(--sunk);border-radius:999px;padding:4px 11px 4px 7px;font-size:13px;display:inline-flex;gap:6px;align-items:center}

/* solo */
.solo-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bigletter{font-family:var(--f-display);font-weight:900;font-size:clamp(110px,26vw,190px);line-height:.85;text-align:center}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center}
.stepper button{width:52px;height:52px;border-radius:50%;border:0;background:var(--sunk);font-size:26px;font-weight:700;cursor:pointer}
.stepper output{font-family:var(--f-display);font-weight:900;font-size:64px;min-width:2ch;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.strip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.strip span{width:26px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;background:var(--sunk);color:var(--chalk-3)}
.strip span.done{background:var(--go);color:var(--ink)} .strip span.skip{background:var(--red);color:#fff} .strip span.cur{background:var(--chalk);color:var(--ink)}
.progress{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.04em}
.pending{font-size:13px;color:var(--chalk-2);min-height:18px;text-align:center}
.result-big{font-family:var(--f-display);font-weight:900;overflow-wrap:anywhere;font-size:clamp(44px,7vw,76px);line-height:.88;margin:0;text-transform:uppercase;text-wrap:balance}

/* classements */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);background:var(--sunk)}
.lb li.me{box-shadow:inset 0 0 0 2px var(--yellow)}
.lb .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;background:var(--card-2)}
.lb li:nth-child(1) .rk{background:var(--yellow);color:var(--ink)} .lb li:nth-child(2) .rk{background:#d9e1dc;color:var(--ink)} .lb li:nth-child(3) .rk{background:#e2a46c;color:var(--ink)}
.lb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .n small{display:block;font-weight:400;color:var(--chalk-2);font-size:12px}
.lb .v{font-family:var(--f-display);font-weight:900;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.lb .v small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--chalk-2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--ink);padding:11px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.red{background:var(--red);color:#fff} .toast.yellow{background:var(--yellow)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:12px}
  .pitchmark{display:none}
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.game{grid-template-columns:1fr}
}
@media (max-width:520px){ .modes{grid-template-columns:1fr} .mode .ic{width:40px;height:40px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="brand" id="brand" type="button" data-i18n-aria="home"><i>F</i>Foot Letter</button>
    <div class="tools">
      <span class="chip" id="netChip" hidden></span>
      <div class="seg" id="langSeg" role="group" aria-label="Langue / Language / Sprache">
        <button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button>
      </div>
      <button class="iconbtn" id="soundBtn" type="button" aria-pressed="false"></button>
    </div>
  </header>

  <!-- ACCUEIL -->
  <main id="home">
    <section class="hero">
      <div>
        <h1>Foot<span>Letter</span></h1>
        <p class="lede" data-i18n-html="hero_lede"></p>
      </div>
      <div class="pitchmark" aria-hidden="true"><div class="half"></div><div class="circle"></div><div class="demo" id="demoLetter">M</div></div>
    </section>

    <section class="panel" style="margin-top:20px">
      <div class="row">
        <div class="field">
          <label class="label" for="nick" data-i18n="nick_label"></label>
          <input class="input" id="nick" maxlength="18" data-i18n-ph="nick_ph" autocomplete="nickname">
        </div>
      </div>
      <div class="modes">
        <button class="mode" id="mFriends" type="button"><span class="k" data-i18n="k_online"></span><span class="ic" style="background:var(--yellow)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.4-.2 4.1 1.3 4.6 4"/></svg></span><strong data-i18n="m_friends"></strong><span class="d" data-i18n="m_friends_d"></span></button>
        <button class="mode" id="mJoin" type="button"><span class="k" data-i18n="k_online"></span><span class="ic" style="background:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M4 12h11"/><path d="M11 8l4 4-4 4"/></svg></span><strong data-i18n="m_join"></strong><span class="d" data-i18n="m_join_d"></span></button>
        <button class="mode" id="mLocal" type="button"><span class="k" data-i18n="k_local"></span><span class="ic" style="background:var(--go)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 17.5h2"/></svg></span><strong data-i18n="m_local"></strong><span class="d" data-i18n="m_local_d"></span></button>
        <button class="mode" id="mDaily" type="button"><span class="k" data-i18n="k_daily"></span><span class="ic" style="background:var(--orange)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span><strong data-i18n="m_daily"></strong><span class="d" data-i18n="m_daily_d"></span><span class="badge" id="dailyBadge" hidden></span></button>
        <button class="mode" id="mDefi" type="button"><span class="k" data-i18n="k_solo"></span><span class="ic" style="background:var(--pink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg></span><strong data-i18n="m_defi"></strong><span class="d" data-i18n="m_defi_d"></span></button>
        <button class="mode" id="mAbc" type="button"><span class="k" data-i18n="k_solo"></span><span class="ic" style="background:var(--purple)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l3.5-11L10 18M4.2 14.5h4.6"/><path d="M14 7h6l-6 11h6"/></svg></span><strong data-i18n="m_abc"></strong><span class="d" data-i18n="m_abc_d"></span></button>
      </div>
      <form class="row" id="joinForm" hidden>
        <div class="field">
          <label class="label" for="joinCode" data-i18n="join_code"></label>
          <input class="input" id="joinCode" maxlength="4" placeholder="ABCD" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em">
        </div>
        <button class="btn primary" type="submit" id="joinBtn" data-i18n="join_btn"></button>
      </form>
      <div class="row" style="justify-content:space-between;align-items:center">
        <button class="btn small" id="boardsBtn" type="button" data-i18n="boards_btn"></button>
        <div class="netbar"><span class="label" data-i18n="net_label"></span><span class="leds" id="leds"></span><span class="note" id="netNote"></span></div>
      </div>
    </section>

    <ul class="rules" style="margin-top:20px">
      <li><b data-i18n="r1b"></b><span data-i18n="r1"></span></li>
      <li><b data-i18n="r2b"></b><span data-i18n="r2"></span></li>
      <li><b data-i18n="r3b"></b><span data-i18n="r3"></span></li>
      <li><b data-i18n="r4b"></b><span data-i18n="r4"></span></li>
    </ul>
    <p class="note" style="margin-top:12px" id="dbNote"></p>
    <p class="note" style="margin-top:6px;color:var(--chalk-3)">FOOT LETTER · v5.1</p>
  </main>

  <!-- RÉGLAGES MÊME ÉCRAN -->
  <main id="setup" hidden>
    <section class="two">
      <div class="panel">
        <div class="label" data-i18n="k_local"></div>
        <h2 class="h2" data-i18n="who_plays"></h2>
        <p class="note" data-i18n="setup_note"></p>
        <div class="local-names" id="localNames"></div>
        <div class="row"><button class="btn small ghost" id="addLocal" type="button" data-i18n="add_player"></button></div>
      </div>
      <div class="panel">
        <div class="label" data-i18n="settings"></div>
        <div class="settings" id="setLocal"></div>
        <button class="btn primary" id="startLocal" type="button" data-i18n="kickoff"></button>
      </div>
    </section>
  </main>

  <!-- SALON -->
  <main id="lobby" hidden>
    <section class="two">
      <div class="panel">
        <div class="label" data-i18n="join_code"></div>
        <div class="code-big" id="lobbyCode">----</div>
        <div class="row">
          <button class="btn small primary" id="copyLink" type="button" data-i18n="copy_link"></button>
          <button class="btn small" id="copyCode" type="button" data-i18n="copy_code"></button>
        </div>
        <p class="note" id="lobbyHelp"></p>
        <div class="label" id="setLabel"></div>
        <div class="settings" id="setOnline"></div>
      </div>
      <div class="panel">
        <div class="label" id="rosterLabel"></div>
        <ul class="roster" id="roster"></ul>
        <div class="row" style="justify-content:space-between">
          <button class="btn ghost small" id="leaveLobby" type="button" data-i18n="leave"></button>
          <button class="btn primary" id="startOnline" type="button" data-i18n="kickoff"></button>
        </div>
        <p class="note" id="lobbyWait"></p>
      </div>
    </section>
  </main>

  <!-- PARTIE -->
  <main id="game" hidden>
    <div class="topbar" style="margin-bottom:12px">
      <div class="tools">
        <span class="chip"><span data-i18n="letter"></span> <b id="gLetterChip">-</b></span>
        <span class="chip" id="gRoundChip"></span>
        <span class="chip" id="gCodeChip" hidden><span data-i18n="room"></span> <b id="gCode"></b></span>
        <span class="chip" id="gRules"></span>
      </div>
      <button class="btn ghost small" id="quitGame" type="button" data-i18n="leave"></button>
    </div>
    <section class="game">
      <div class="stage" id="stage">
        <div class="floaters" id="floaters" aria-hidden="true"></div>
        <div class="ring" id="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="45"/><circle class="prog" id="prog" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
          <div class="inner"><div class="letter" id="bigLetter">?</div><div class="clock" id="clock">2:00</div></div>
        </div>
        <div class="tries" id="tries"></div>
        <div class="turn" aria-live="polite">
          <span class="label" id="turnLabel"></span>
          <span class="who" id="turnWho">—</span>
          <span class="sub" id="turnSub"></span>
        </div>
        <form class="answer" id="answerForm" autocomplete="off">
          <input class="input" id="answer" maxlength="60" autocapitalize="words" spellcheck="false" autocomplete="off">
          <button class="btn primary" id="sendBtn" type="submit" data-i18n="validate"></button>
        </form>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="decide" id="decide" hidden>
          <p id="decideText" aria-live="polite"></p>
          <div class="actions" id="decideBtns"><button class="btn primary small" id="okBtn" type="button" data-i18n="accept"></button><button class="btn small" id="noBtn" type="button" data-i18n="reject"></button></div>
        </div>
        <div class="actions"><button class="btn ghost small" id="giveUp" type="button" data-i18n="give_up"></button></div>
        <div class="reacts" id="reacts" hidden>
          <button type="button" data-e="⚽">⚽</button><button type="button" data-e="🔥">🔥</button><button type="button" data-e="👏">👏</button><button type="button" data-e="😂">😂</button><button type="button" data-e="😱">😱</button><button type="button" data-e="🧤">🧤</button>
        </div>
        <p class="fair" data-i18n="fairplay"></p>
      </div>
      <aside class="side">
        <div class="panel">
          <div class="label" data-i18n="players"></div>
          <ul class="players" id="players"></ul>
        </div>
        <div class="panel">
          <div class="row" style="justify-content:space-between;align-items:center"><div class="label" data-i18n="sheet"></div><span class="chip"><b id="gFoundCount">0</b></span></div>
          <ul class="feed" id="feed"></ul>
        </div>
      </aside>
    </section>
  </main>

  <!-- FIN DE MANCHE -->
  <main id="round" hidden>
    <section class="two">
      <div class="panel">
        <div class="label" id="roundTitle"></div>
        <h2 class="winner" id="roundWinner"></h2>
        <p class="note" id="roundSub"></p>
        <div class="label" data-i18n="round_stats"></div>
        <div class="tblwrap"><table class="tbl" id="roundTable"></table></div>
        <div class="row">
          <button class="btn primary" id="nextRound" type="button" data-i18n="next_round"></button>
          <button class="btn ghost" id="roundQuit" type="button" data-i18n="leave"></button>
        </div>
        <p class="note" id="roundWait"></p>
      </div>
      <div class="panel">
        <div class="label" data-i18n="standings"></div>
        <div class="tblwrap"><table class="tbl" id="standTable"></table></div>
        <div class="label" data-i18n="found_list"></div>
        <div class="found" id="roundFound"></div>
      </div>
    </section>
  </main>

  <!-- FIN DE MATCH -->
  <main id="over" hidden>
    <section class="two">
      <div class="panel">
        <div class="label" data-i18n="final"></div>
        <h2 class="winner" id="winner">—</h2>
        <p class="note" id="overSub"></p>
        <div class="podium" id="podium"></div>
        <div class="awards" id="awards"></div>
        <div class="row">
          <button class="btn primary" id="again" type="button" data-i18n="again"></button>
          <button class="btn ghost" id="toHome" type="button" data-i18n="home"></button>
        </div>
        <p class="note" id="againNote"></p>
      </div>
      <div class="panel">
        <div class="label" data-i18n="standings"></div>
        <div class="tblwrap"><table class="tbl" id="finalTable"></table></div>
        <div class="label" data-i18n="found_list"></div>
        <div class="found" id="foundList"></div>
      </div>
    </section>
  </main>

  <!-- MODES SOLO -->
  <main id="solo" hidden>
    <div class="solo-top">
      <div class="tools"><span class="chip"><b id="soloMode"></b></span><span class="chip" id="soloInfo"></span></div>
      <button class="btn ghost small" id="soloBack" type="button" data-i18n="home"></button>
    </div>

    <section class="two" id="soloIntro" style="margin-top:14px">
      <div class="panel">
        <h2 class="h2" id="introTitle"></h2>
        <p class="note" id="introText" style="font-size:15px"></p>
        <div id="introLetterWrap" hidden>
          <div class="label" style="text-align:center" data-i18n="your_letter"></div>
          <div class="bigletter" id="introLetter">?</div>
          <div class="actions"><button class="btn small ghost" id="rerollBtn" type="button" data-i18n="reroll"></button></div>
        </div>
        <div id="betWrap" hidden>
          <div class="label" style="text-align:center" data-i18n="bet"></div>
          <div class="stepper"><button type="button" id="betMinus" aria-label="-1">−</button><output id="betVal">10</output><button type="button" id="betPlus" aria-label="+1">+</button></div>
          <div class="actions" id="betPresets"></div>
        </div>
        <div id="abcPreview" class="strip" hidden></div>
        <button class="btn primary" id="soloGo" type="button"></button>
        <p class="note" id="introNote"></p>
      </div>
      <div class="panel flat">
        <div class="label" id="introBoardTitle"></div>
        <ul class="lb" id="introBoard"></ul>
      </div>
    </section>

    <section class="game" id="soloPlay" hidden style="margin-top:14px">
      <div class="stage" id="sStage">
        <div class="ring" id="sRing">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="45"/><circle class="prog" id="sProg" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
          <div class="inner"><div class="letter" id="sLetter">?</div><div class="clock" id="sClock">0:30</div></div>
        </div>
        <div class="progress" id="sProgress"></div>
        <div class="strip" id="sStrip" hidden></div>
        <form class="answer" id="sForm" autocomplete="off">
          <input class="input" id="sAnswer" maxlength="60" autocapitalize="words" spellcheck="false" autocomplete="off">
          <button class="btn primary" id="sSend" type="submit" data-i18n="validate"></button>
        </form>
        <div class="feedback" id="sFeedback" aria-live="polite"></div>
        <div class="pending" id="sPending"></div>
        <div class="actions"><button class="btn small" id="sJoker" type="button" hidden></button><button class="btn ghost small" id="sQuit" type="button" data-i18n="abandon"></button></div>
        <p class="fair" data-i18n="fairplay_solo"></p>
      </div>
      <aside class="side">
        <div class="panel">
          <div class="row" style="justify-content:space-between;align-items:center"><div class="label" data-i18n="found_list"></div><span class="chip"><b id="sCount">0</b></span></div>
          <ul class="feed" id="sFeed"></ul>
        </div>
      </aside>
    </section>

    <section class="two" id="soloEnd" hidden style="margin-top:14px">
      <div class="panel">
        <div class="label" id="eLabel"></div>
        <h2 class="result-big" id="eTitle"></h2>
        <p class="note" id="eSub" style="font-size:15px"></p>
        <p class="note" id="eRank"></p>
        <div class="row">
          <button class="btn primary" id="eShare" type="button" data-i18n="share"></button>
          <button class="btn" id="eAgain" type="button" data-i18n="again"></button>
          <button class="btn ghost" id="eBoards" type="button" data-i18n="boards_btn"></button>
        </div>
        <div class="label" data-i18n="found_list"></div>
        <div class="found" id="eFound"></div>
      </div>
      <div class="panel flat">
        <div class="label" id="eBoardTitle"></div>
        <ul class="lb" id="eBoard"></ul>
      </div>
    </section>
  </main>

  <!-- CLASSEMENTS -->
  <main id="boards" hidden>
    <div class="solo-top">
      <h2 class="h2" data-i18n="boards_btn"></h2>
      <button class="btn ghost small" id="bBack" type="button" data-i18n="home"></button>
    </div>
    <section class="panel" style="margin-top:14px">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="seg" id="bTabs">
          <button type="button" data-tab="daily" data-i18n="m_daily"></button><button type="button" data-tab="defi" data-i18n="m_defi"></button><button type="button" data-tab="abc" data-i18n="m_abc"></button>
        </div>
        <button class="btn small" id="bRefresh" type="button" data-i18n="refresh"></button>
      </div>
      <div class="letters" id="bLetters" hidden></div>
      <div class="label" id="bTitle"></div>
      <ul class="lb" id="bList"></ul>
      <p class="note" data-i18n="boards_note"></p>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

</script>
<script>

function norm(s){

const P=[], IDX=new Map(), FIRST=new Set();

    if(!full||seen.has(full)) return; seen.add(full);

function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let rowMin=i;
    for(let j=1;j<=b.length;j++){ const c=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); cur.push(c); if(c<rowMin) rowMin=c; }
    if(rowMin>max) return max+1; prev=cur;
  }
  return prev[b.length];
}
function lookup(n){
  if(IDX.get(n)) return {ids:[...IDX.get(n)],key:n,fuzzy:false};
  const tol=n.length>=10?2:n.length>=5?1:0;
  if(!tol) return {ids:[],key:n};
  let best=[],bd=tol+1,bk=n;
  for(const k of (IDX_BY_LETTER.get(n[0])||[])){ const d=lev(k,n,tol); if(d<bd){ bd=d; best=[...IDX.get(k)]; bk=k; } }
  return bd<=tol?{ids:best,key:bk,fuzzy:true}:{ids:[],key:n};
}
function titleCase(s){ return String(s).trim().replace(/\s+/g,' ').slice(0,40).split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' '); }
function nameLetters(n){ const tk=n.split(' '), L=new Set([tk[0][0]]); let i=0; while(i<tk.length-1&&PARTICLES.has(tk[i])) i++; L.add(tk[i][0]); return L; }

/* Vérification locale : {st:'ok',display,keys} | {st:'bad',c,x,count} | {st:'unknown',n} */
function checkLocal(input,letter,used){
  const n=norm(input), l=letter.toLowerCase();
  if(n.length<2) return {st:'bad',c:'short',count:false};
  if(!IDX.get(n)&&FIRST.has(n)) return {st:'bad',c:'first',x:titleCase(input),count:true};
  const r=lookup(n);
  if(r.ids.length){
    const k=r.key;
    const fullHit=r.ids.filter(i=>P[i].full===k&&P[i].name.includes(' '));
    const pool=fullHit.length?fullHit:r.ids;
    const withL=pool.filter(i=>(P[i].full===k&&P[i].name.includes(' '))?fullNameLetters(k).has(l):nameLetters(k).has(l));
    if(!withL.length){ if(r.fuzzy) return {st:'unknown',n}; return {st:'bad',c:'letter',x:P[pool[0]].name,count:true}; }
    let display,keys;
    const exactFull=withL.filter(i=>P[i].full===k);
    if(exactFull.length===1||withL.length===1){
      const id=exactFull.length===1?exactFull[0]:withL[0];
      display=P[id].name; keys=['f:'+P[id].full];
      if(P[id].full!==k) keys.push('s:'+k);
      else{ const sk=surKey(id); if((IDX.get(sk)||[]).length===1) keys.push('s:'+sk); }
    } else { display=surDisplay(withL[0],k)||titleCase(input); keys=['s:'+k]; }
    if(keys.some(x=>used.has(x))) return {st:'bad',c:'dup',x:display,count:true};
    return {st:'ok',display,keys};
  }
  if(!nameLetters(n).has(l)&&!fullNameLetters(n).has(l)) return {st:'bad',c:'letter2',x:titleCase(input),count:true};
  return {st:'unknown',n};
}

function fetchJSON(url,ms){

}
const WD='https://www.wikidata.org/w/api.php?format=json&origin=*&';
function wdSearch(text,limit,extra){

  return fetchJSON(WD+'action=query&list=search&srlimit='+limit+'&srsearch='+encodeURIComponent(q),7000)

}

const NOT_WP=/^(commons|species|meta|wikidata|mediawiki|sources|outreach|incubator|wikimania|foundation)wiki$/;
function wpCount(e){ return Object.keys(e.sitelinks||{}).filter(k=>/wiki$/.test(k)&&!NOT_WP.test(k)).length; }
const WD_SEARCH=new Map();
// Recherche d'un nom parmi les footballeurs pros (au moins un club et 2 articles Wikipédia)
function wikiLookup(input){
  const n=norm(input);
  if(WD_SEARCH.has(n)) return WD_SEARCH.get(n);
  const pr=(async()=>{
    const ids=(await wdSearch(input,20,'haswbstatement:P54')).slice(0,20);
    if(!ids.length) return {hits:[]};
    const ents=await wdEntities(ids,'labels|aliases|sitelinks','fr|en|de|es|pt|it|nl');
    const hits=[];
    ids.forEach(id=>{
      const e=ents[id]; if(!e||!e.labels) return;
      if(wpCount(e)<2) return;
      const names=[...Object.values(e.labels).map(x=>x.value),...Object.values(e.aliases||{}).flat().map(x=>x.value)];
      const label=(e.labels.fr||e.labels.en||Object.values(e.labels)[0]||{}).value||'';
      let type=null;
      for(const nm of names){ const x=norm(nm); if(x===n){ type=x.includes(' ')?'full':'mono'; break; } if(x.endsWith(' '+n)) type='sur'; }
      if(type&&label) hits.push({id,label,type});
    });
    return {hits};
  })().catch(()=>({error:true,hits:[]}));
  WD_SEARCH.set(n,pr); pr.then(v=>{ if(v.error) WD_SEARCH.delete(n); });
  return pr;
}
// Résolution complète d'une réponse inconnue en local
async function resolveRemote(text,letter,used){
  const n=norm(text), l=letter.toLowerCase(), res=await wikiLookup(text);
  if(res.error) return {st:'none',off:1};
  const hits=res.hits.filter(h=>h.type==='full'?fullNameLetters(n).has(l):nameLetters(n).has(l));
  if(!hits.length) return res.hits.length?{st:'bad',c:'letter2',x:titleCase(text),count:true}:{st:'none'};
  let display,keys;
  const fulls=hits.filter(h=>h.type!=='sur');
  if(hits.length===1||fulls.length===1){ const h=fulls.length===1?fulls[0]:hits[0]; display=h.label; keys=['f:'+norm(h.label)]; if(norm(h.label)!==n) keys.push('s:'+n); }
  else { display=titleCase(text); keys=[(n.includes(' ')?'f:':'s:')+n]; }
  if(keys.some(k=>used.has(k))) return {st:'bad',c:'dup',x:display,count:true};
  return {st:'ok',display,keys};
}

  H.states=()=>H.conns.map(c=>c.connected?true:c.state);
  H.onChange=f=>{ H.change.add(f); return ()=>H.change.delete(f); };
  H.sub=(tp,fn)=>{ let set=H.handlers.get(tp); const first=!set; if(first){ set=new Set(); H.handlers.set(tp,set); } set.add(fn);
    const ready=first?Promise.all(H.conns.map(c=>c.sub(tp))):Promise.resolve();
    return {ready,off:()=>{ set.delete(fn); if(!set.size&&H.handlers.get(tp)===set){ H.handlers.delete(tp); H.conns.forEach(c=>c.unsub(tp)); } }}; };
  H.pub=(tp,s,retain)=>H.conns.map(c=>c.pub(tp,s,retain)).filter(Boolean).length;
  H.ready=ms=>new Promise(res=>{ const t0=Date.now(); (function chk(){ if(H.count()) return res(true); if(Date.now()-t0>ms) return res(false); setTimeout(chk,80); })(); });
  return H;
})();

/* Salons : l'hôte fait autorité, chacun publie son « état » et l'hôte rediffuse la liste à tous */
const Net=(function(){
  function mk(){ return {handlers:[],errs:[],list:[],byId:new Map(),myId:null,own:{},dead:false,timers:[],offs:[]}; }
  function applyList(r,raw){
    const now=Date.now(), next=new Map(), joined=[], updated=[], left=[];
    raw.forEach(x=>{
      if(!x||typeof x.peer!=='string') return;
      const presence=(x.presence&&typeof x.presence==='object')?x.presence:{};
      const js=JSON.stringify(presence), prev=r.byId.get(x.peer);
      let p;
      if(!prev){ p={peer:x.peer,presence,_js:js,updatedAt:now,sameTab:x.peer===r.myId}; joined.push(p); }
      else if(prev._js!==js){ p=Object.assign({},prev,{presence,_js:js,updatedAt:now}); updated.push(p); }
      else p=prev;
      next.set(x.peer,p);
    });
    r.byId.forEach((p,id)=>{ if(!next.has(id)) left.push(p); });
    r.byId=next; r.list=[...next.values()];
    if(joined.length||updated.length||left.length) r.handlers.forEach(h=>{ try{ h({peers:r.list,joined,updated,left}); }catch(e){ console.error(e); } });
  }
  function fail(r,msg){ if(r.dead) return; r.dead=true; r.timers.forEach(x=>clearInterval(x)); r.offs.forEach(f=>f()); r.errs.forEach(f=>{ try{ f({code:'upstream_error',message:msg}); }catch(_){ } }); }
  function api(r,send,close){
    return {
      peers:()=>r.list, links:()=>Hub.count(),
      onPeers:(h,err)=>{ r.handlers.push(h); if(err) r.errs.push(err); setTimeout(()=>{ try{ h({peers:r.list,joined:r.list,updated:[],left:[]}); }catch(e){ console.error(e); } },0); },
      presence:patch=>{ Object.keys(patch||{}).forEach(k=>{ if(patch[k]===null) delete r.own[k]; else r.own[k]=patch[k]; }); send(); },
      leave:()=>{ if(!r.dead){ r.dead=true; r.timers.forEach(x=>clearInterval(x)); close(); r.offs.forEach(f=>f()); } }
    };
  }
  async function host(code){
    if(!(await Hub.ready(9000))) throw {type:'network'};
    const base=ROOT+'room/'+code, r=mk(); r.myId='h'+rid(9);
    const pres=new Map([[r.myId,{}]]), seen=new Map();
    const broadcast=()=>{ const list=[...pres.entries()].map(([peer,presence])=>({peer,presence})); Hub.pub(base+'/down',JSON.stringify({t:'peers',list})); applyList(r,list); };
    const h=Hub.sub(base+'/up/+',(tp,txt)=>{
      if(r.dead) return;
      const id=tp.split('/').pop(); if(!/^[a-z0-9]{6,16}$/.test(id)) return;
      let m; try{ m=JSON.parse(txt); }catch(_){ return; } if(!m) return;
      if(m.t==='bye'){ if(pres.delete(id)){ seen.delete(id); broadcast(); } return; }
      if(m.t==='p'&&m.p&&typeof m.p==='object'){
        const js=JSON.stringify(m.p); if(js.length>4096) return;
        if(!pres.has(id)&&pres.size>=MAX_PLAYERS+4) return;
        seen.set(id,Date.now());
        const before=pres.has(id)?JSON.stringify(pres.get(id)):null;
        pres.set(id,m.p);
        if(before!==js) broadcast();
      }
    });
    r.offs.push(h.off, Hub.onChange(()=>{ if(Hub.count()) broadcast(); }));
    r.timers.push(setInterval(()=>{ const now=Date.now(); seen.forEach((x,id)=>{ if(now-x>25000){ seen.delete(id); pres.delete(id); } }); broadcast(); },2000));
    return api(r,()=>{ pres.set(r.myId,JSON.parse(JSON.stringify(r.own))); broadcast(); },()=>{ Hub.pub(base+'/down','{"t":"end"}'); });
  }
  async function join(code){
    if(!(await Hub.ready(9000))) throw {type:'network'};
    const base=ROOT+'room/'+code, r=mk(); r.myId=rid(10);
    const send=()=>Hub.pub(base+'/up/'+r.myId,JSON.stringify({t:'p',p:r.own}));
    return new Promise((res,rej)=>{
      let found=false,lastHost=0,endAt=0;
      const h=Hub.sub(base+'/down',(tp,txt)=>{
        if(r.dead) return;
        let m; try{ m=JSON.parse(txt); }catch(_){ return; } if(!m) return;
        if(m.t==='end'){ endAt=Date.now(); if(found) setTimeout(()=>{ if(lastHost<endAt) fail(r,'host-left'); },3500); return; }
        if(m.t==='peers'&&Array.isArray(m.list)){
          lastHost=Date.now();
          if(!found){
            found=true; clearInterval(iv); clearTimeout(to);
            r.timers.push(setInterval(()=>{ send(); if(Date.now()-lastHost>15000) fail(r,'host-timeout'); },3000));
            res(api(r,send,()=>{ Hub.pub(base+'/up/'+r.myId,'{"t":"bye"}'); }));
          }
          applyList(r,m.list);
        }
      });
      r.offs.push(h.off, Hub.onChange(()=>{ if(Hub.count()&&found) send(); }));
      h.ready.then(send);
      const iv=setInterval(send,1200);
      const to=setTimeout(()=>{ if(found) return; clearInterval(iv); h.off(); rej({type:Hub.count()?'no-host':'network'}); },9000);
    });
  }
  return {host,join};
})();

/* Classements publics : un message « retenu » par tableau sur chaque serveur, fusionné à la lecture */
const LB=(function(){
  const KINDS={
    daily:{cmp:(a,b)=>b.s-a.s||a.t-b.t||a.d-b.d, ok:e=>e.s>=0&&e.s<=90&&e.t>=0&&e.t<=200000},
    defi:{cmp:(a,b)=>b.s-a.s||a.t-b.t||a.d-b.d, ok:e=>e.s>=1&&e.s<=99&&e.t>=e.s*250&&e.t<=3600000},
    abc:{cmp:(a,b)=>a.t-b.t||a.s-b.s||a.d-b.d, ok:e=>e.s>=0&&e.s<=3&&e.t>=4000&&e.t<=3600000}
  };
  const topic=(k,key)=>ROOT+'lb/'+k+'/'+key;
  function clean(k,e){
    if(!e||typeof e!=='object') return null;
    const o={n:cleanNick(e.n),s:Math.round(+e.s),t:Math.round(+e.t),d:Math.round(+e.d)||0,i:String(e.i||'').replace(/[^a-z0-9]/g,'').slice(0,12)};
    if(![o.s,o.t,o.d].every(Number.isFinite)) return null;
    return KINDS[k].ok(o)?o:null;
  }
  function merge(k,lists){
    const best=new Map();
    lists.forEach(list=>(list||[]).forEach(raw=>{ const e=clean(k,raw); if(!e) return; const key=norm(e.n); const cur=best.get(key); if(!cur||KINDS[k].cmp(e,cur)<0) best.set(key,e); }));
    return [...best.values()].sort(KINDS[k].cmp).slice(0,50);
  }
  async function readRaw(pattern){
    if(!(await Hub.ready(6000))) return null;
    const got=new Map();
    const h=Hub.sub(pattern,(tp,txt)=>{ let d; try{ d=JSON.parse(txt); }catch(_){ return; } if(!d||!Array.isArray(d.e)) return; if(!got.has(tp)) got.set(tp,[]); got.get(tp).push(d.e); });
    await h.ready; await new Promise(r=>setTimeout(r,450));
    h.off();
    return got;
  }
  async function read(k,key){
    const tp=topic(k,key), cache=lsGet('fl_lb_'+k+'_'+key)||[];
    const got=await readRaw(tp);
    if(!got) return {list:merge(k,[cache]),off:true};
    const lists=got.get(tp)||[];
    const list=merge(k,[cache,...lists]);
    const maxLen=Math.max(0,...lists.map(x=>x.length));
    if(list.length>maxLen) Hub.pub(tp,JSON.stringify({e:list}),true);
    lsSet('fl_lb_'+k+'_'+key,list);
    return {list};
  }
  async function readAll(k){
    const got=await readRaw(ROOT+'lb/'+k+'/+');
    const out={};
    if(got) got.forEach((lists,tp)=>{ out[tp.split('/').pop()]=merge(k,lists); });
    return got?out:null;
  }
  async function submit(k,key,entry){
    const tp=topic(k,key), cache=lsGet('fl_lb_'+k+'_'+key)||[];
    const got=await readRaw(tp);
    const list=merge(k,[cache,...(got&&got.get(tp)||[]),[entry]]);
    lsSet('fl_lb_'+k+'_'+key,list);
    if(got) Hub.pub(tp,JSON.stringify({e:list}),true);
    return {list,off:!got};
  }
  return {read,readAll,submit,cmp:k=>KINDS[k].cmp};
})();

/* ================= MOTEUR DE MATCH (hôte) ================= */
const DEFAULT_CFG={t:120,tries:3,letter:'?',rounds:3};
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function makeEngine(publish){
  const e={g:null,deadline:0,pauseRem:0,timer:null,dt:null,keys:new Set(),cfg:{...DEFAULT_CFG},usedL:[],lastFoul:{}};
  const TMS=()=>e.g.t*1000;
  const remaining=()=>e.g.paused?e.pauseRem:Math.max(0,e.deadline-Date.now());
  function pub(){ const g=e.g; g.v++; g.rem=g.phase==='play'?remaining():(g.t?g.t*1000:0); publish(g); }
  const alive=()=>e.g.order.filter(id=>e.g.al[id]);
  function endRound(){
    const g=e.g, a=alive();
    clearInterval(e.timer); clearTimeout(e.dt);
    g.check=null; g.pend=null; g.paused=0;
    const place=[...a,...[...g.elim].reverse()].filter((x,i,arr)=>arr.indexOf(x)===i);
    g.order.forEach(id=>{ if(!place.includes(id)) place.push(id); });
    const multi=g.order.length>1, PTS=[3,2,1];
    g.res=place.map((id,i)=>{ const pts=multi?(PTS[i]||0):0; g.pts[id]=(g.pts[id]||0)+pts; return {p:id,pl:i+1,pts,f:g.sc[id]||0,m:g.miss[id]||0,a:g.sc[id]?Math.round(g.rt[id]/g.sc[id]*10)/10:null,y:g.yc[id]||0}; });
    g.rw=multi?place[0]:null;
    g.phase=g.round>=g.rounds?'over':'rend';
    if(g.phase==='over'){
      const rank=[...g.order].sort((x,y)=>(g.pts[y]||0)-(g.pts[x]||0)||(g.tf[y]||0)-(g.tf[x]||0));
      g.final=rank; g.win=rank[0];
      g.tie=multi&&rank.length>1&&(g.pts[rank[0]]||0)===(g.pts[rank[1]]||0)&&(g.tf[rank[0]]||0)===(g.tf[rank[1]]||0);
    }
  }
  function checkEnd(){ const g=e.g, a=alive(); if((g.order.length===1&&a.length===0)||(g.order.length>1&&a.length<=1)){ endRound(); return true; } return false; }
  function advance(){
    const g=e.g; g.check=null; g.pend=null; g.paused=0; g.tu=0;
    if(checkEnd()) return;
    const o=g.order, i=o.indexOf(g.cur);
    for(let s=1;s<=o.length;s++){ const c=o[(i+s)%o.length]; if(g.al[c]){ g.cur=c; break; } }
    g.tid++; e.deadline=Date.now()+TMS();
  }
  function elim(pid,why){ const g=e.g; if(!g.al[pid]) return; g.al[pid]=0; g.elim.push(pid); g.ev={k:(g.ev?.k||0)+1,p:pid,w:why}; if(g.cur===pid) advance(); else checkEnd(); }
  function pause(){ const g=e.g; if(!g.paused){ e.pauseRem=Math.max(1000,e.deadline-Date.now()); g.paused=1; } }
  function resume(){ const g=e.g; if(g.paused){ e.deadline=Date.now()+e.pauseRem; g.paused=0; } g.check=null; g.pend=null; }
  function accept(pid,display,keys){
    const g=e.g, secs=Math.max(0,Math.round((TMS()-remaining())/100)/10);
    keys.forEach(k=>e.keys.add(k));
    g.log.push([g.order.indexOf(pid),display,secs]); g.all.push([g.order.indexOf(pid),display]);
    g.sc[pid]=(g.sc[pid]||0)+1; g.tf[pid]=(g.tf[pid]||0)+1; g.rt[pid]=(g.rt[pid]||0)+secs;
    if(!g.fast||secs<g.fast[2]) g.fast=[pid,display,secs];
    g.last={k:(g.last?.k||0)+1,p:pid,ok:1,x:display,s:secs};
    advance(); pub();
  }
  function reject(pid,c,x,count){
    const g=e.g; resume();
    if(count!==false){ g.tu=(g.tu||0)+1; g.miss[pid]=(g.miss[pid]||0)+1; g.tm[pid]=(g.tm[pid]||0)+1; }
    g.last={k:(g.last?.k||0)+1,p:pid,ok:0,c,x,L:g.letter};
    if(count!==false&&g.mt&&g.tu>=g.mt) elim(pid,'tries');
    pub();
  }
  function pickLetter(){
    const g=e.g;
    if(g.round===1&&e.cfg.letter&&e.cfg.letter!=='?') return e.cfg.letter.toUpperCase();
    const pool=DRAW_LETTERS.filter(l=>!e.usedL.includes(l));
    const src=pool.length?pool:DRAW_LETTERS;
    return src[Math.floor(Math.random()*src.length)].toUpperCase();
  }
  function startRound(){
    const g=e.g;
    g.letter=pickLetter(); e.usedL.push(g.letter.toLowerCase());
    g.chosen=g.round===1&&e.cfg.letter!=='?'?1:0;
    g.al={}; g.sc={}; g.yc={}; g.miss={}; g.rt={};
    g.order.forEach(id=>{ g.al[id]=g.gone[id]?0:1; g.sc[id]=0; g.yc[id]=0; g.miss[id]=0; g.rt[id]=0; });
    g.elim=g.order.filter(id=>g.gone[id]);
    const starters=g.order.filter(id=>!g.gone[id]);
    g.cur=starters.length?starters[(g.round-1)%starters.length]:g.order[0];
    g.log=[]; g.tu=0; g.tid=(g.tid||0)+1; g.check=null; g.pend=null; g.paused=0; g.res=null; g.rw=null; g.last=null; g.ev=null;
    g.phase='draw'; e.keys=new Set(); e.lastFoul={};
    pub();
    clearInterval(e.timer); clearTimeout(e.dt);
    e.dt=setTimeout(()=>{ if(e.g.phase!=='draw') return; e.g.phase='play'; e.deadline=Date.now()+TMS(); if(!checkEnd()) {} pub(); },g.chosen?1200:2600);
    e.timer=setInterval(()=>{ const x=e.g; if(x&&x.phase==='play'&&!x.paused&&Date.now()>=e.deadline){ elim(x.cur,'time'); pub(); } },150);
  }
  e.setCfg=cfg=>{ e.cfg={...e.cfg,...cfg}; if(e.g&&e.g.phase==='lobby'){ e.g.cfg={...e.cfg}; e.g.v++; publish(e.g); } };
  e.lobby=()=>{ clearInterval(e.timer); clearTimeout(e.dt); e.g={v:(e.g?.v||0)+1,phase:'lobby',cfg:{...e.cfg}}; publish(e.g); };
  e.start=players=>{
    const cfg=e.cfg, order=shuffle(players.map(p=>p.id)), nk={};
    players.forEach(p=>{ nk[p.id]=p.nick; });
    e.usedL=[];
    e.g={v:(e.g?.v||0)+1,order,nk,t:cfg.t,mt:cfg.tries,rounds:cfg.rounds,round:1,pts:{},tf:{},tm:{},gone:{},all:[],fast:null,tid:0,cfg:{...cfg}};
    order.forEach(id=>{ e.g.pts[id]=0; e.g.tf[id]=0; e.g.tm[id]=0; });
    startRound();
  };
  e.next=()=>{ const g=e.g; if(!g||g.phase!=='rend') return; g.round++; startRound(); };
  e.submit=(pid,text)=>{
    const g=e.g; if(!g||g.phase!=='play'||g.cur!==pid||g.check||g.pend) return;
    text=String(text).trim().slice(0,60);
    const r=checkLocal(text,g.letter,e.keys);
    if(r.st==='ok') return accept(pid,r.display,r.keys);
    if(r.st==='bad') return reject(pid,r.c,r.x,r.count);
    const tid=g.tid;
    pause(); g.check={p:pid,v:text}; pub();
    resolveRemote(text,g.letter,e.keys).then(res=>{
      const g2=e.g; if(!g2||g2.tid!==tid||g2.phase!=='play'||!g2.check) return;
      if(res.st==='ok') return accept(pid,res.display,res.keys);
      if(res.st==='bad') return reject(pid,res.c,res.x,res.count);
      g2.check=null; g2.pend={p:pid,v:text,off:res.off?1:0}; pub();
    });
  };
  e.decide=ok=>{
    const g=e.g; if(!g||!g.pend||g.phase!=='play') return;
    const {p,v}=g.pend, n=norm(v);
    if(!ok) return reject(p,'refused',titleCase(v));
    const keys=[(n.includes(' ')?'f:':'s:')+n];
    if(keys.some(k=>e.keys.has(k))) return reject(p,'dup',titleCase(v));
    accept(p,titleCase(v),keys);
  };
  e.eliminate=(pid,why)=>{ const g=e.g; if(!g||!g.al||!g.al[pid]||(g.phase!=='play'&&g.phase!=='draw')) return; elim(pid,why); pub(); };
  e.leftMatch=pid=>{ const g=e.g; if(!g||!g.order||!g.order.includes(pid)) return; g.gone[pid]=1; if(g.al&&g.al[pid]&&(g.phase==='play'||g.phase==='draw')){ elim(pid,'left'); pub(); } else { g.v++; publish(g); } };
  e.foul=pid=>{
    const g=e.g; if(!g||!g.al||!g.al[pid]||(g.phase!=='play'&&g.phase!=='draw')) return;
    const now=Date.now(); if(now-(e.lastFoul[pid]||0)<2500) return; e.lastFoul[pid]=now;
    g.yc[pid]=(g.yc[pid]||0)+1;
    if(g.yc[pid]>=2) elim(pid,'yy'); else g.ev={k:(g.ev?.k||0)+1,p:pid,w:'yellow'};
    pub();
  };
  e.stop=()=>{ clearInterval(e.timer); clearTimeout(e.dt); };
  return e;
}

function handleReactions(peers){
  peers.forEach(p=>{ if(p.sameTab||!p.presence||!p.presence.re) return; const re=p.presence.re; if(typeof re.n!=='number'||!REACT_OK.has(re.e)) return; const prev=S.reSeen[p.peer]; S.reSeen[p.peer]=re.n; if(prev===undefined||re.n<=prev) return; if(SCREEN==='game') floatEmoji(re.e,cleanNick(p.presence.nick)); });
}

function onLeavePage(){
  const now=Date.now(); if(now-(S._lastFoul||0)<2500) return;
  if(SCREEN==='solo'&&Solo.active()){ S._lastFoul=now; Solo.foul(); return; }
  const g=S.g; if(!g||(g.phase!=='play'&&g.phase!=='draw')||!S.engine&&S.mode!=='online') return;
  if(S.mode==='local'){ S._lastFoul=now; S.engine.foul(g.cur); return; }
  if(S.mode==='online'&&g.al&&g.al[S.me]){ S._lastFoul=now; if(S.isHost) S.engine.foul(S.me); else sendSub({foul:1}); }
}

function renderNet(){
  const st=Hub.states(), b=$('leds'); b.replaceChildren();

  const note=$('netNote');
  if(n===BROKERS.length){ note.textContent=t('net_ok'); note.className='note ok'; }
  else if(n>0){ note.textContent=t('net_partial',{n,m:BROKERS.length}); note.className='note ok'; }
  else if(decided){ note.textContent=t('net_none'); note.className='note warn'; }
  else { note.textContent=t('net_wait'); note.className='note'; }

  if(S.mode==='online'){ c.hidden=false; c.textContent=n?t('chip_on')+` (${n}/${BROKERS.length})`:t('chip_re'); c.style.color=n?'var(--go)':'var(--yellow)'; } else c.hidden=true;
}

function netErr(e){ return e&&e.type==='no-host'?t('err_nohost'):t('err_net'); }

async function createRoom(){
  if(!requireNick()) return;
  leaveOnline();
  const code=randCode();
  $('mFriends').disabled=true; toast(t('open_room'));
  try{ S.nr=await Net.host(code); }catch(e){ $('mFriends').disabled=false; toast(netErr(e)); return; }
  $('mFriends').disabled=false; $('toast').hidden=true;
  S.mode='online'; S.isHost=true; S.code=code; S.seen={}; S.reSeen={}; resetView();

  S.nr.onPeers(onRoomPeers,onRoomError);

async function joinRoom(code){
  code=String(code||'').toLowerCase().replace(/[^a-z]/g,'');
  if(code.length!==4){ toast(t('code_len')); return; }
  if(!requireNick()) return;
  leaveOnline();
  $('joinBtn').disabled=true; toast(t('search_room',{c:code.toUpperCase()}));
  try{ S.nr=await Net.join(code); }catch(e){ $('joinBtn').disabled=false; toast(netErr(e)); return; }
  $('joinBtn').disabled=false; $('toast').hidden=true;
  S.mode='online'; S.isHost=false; S.code=code; S.hostPeer=null; S.g=null; S.reSeen={}; resetView();
  S.nr.onPeers(onRoomPeers,onRoomError);
  S.nr.presence({r:'p',nick:myNick()});
  renderLobby(); renderNet();
}
function onRoomError(){ toast(t('host_left')); leaveOnline(); show('home'); }
function onRoomPeers(ch){
  const peers=ch.peers;
  const meP=peers.find(p=>p.sameTab); if(meP) S.me=meP.peer;
  handleReactions(peers);
  if(S.isHost){
    S.hostPeer=S.me;
    ch.left.forEach(p=>S.engine.leftMatch(p.peer));
    [...ch.joined,...ch.updated].forEach(p=>{
      if(p.sameTab||!p.presence) return;
      const sub=p.presence.sub;
      if(sub&&typeof sub.n==='number'&&sub.n>(S.seen[p.peer]||0)){
        S.seen[p.peer]=sub.n;
        if(sub.foul) S.engine.foul(p.peer);
        else if(sub.give) S.engine.eliminate(p.peer,'give');
        else if(typeof sub.v==='string') S.engine.submit(p.peer,sub.v.slice(0,60));
      }
    });
    if(S.engine.g&&S.engine.g.phase==='lobby') renderLobby();
  } else {
    const host=peers.find(p=>p.presence&&p.presence.r==='h'&&!p.sameTab);
    if(host){
      S.hostPeer=host.peer;
      const g=host.presence.g;
      if(g&&typeof g==='object'&&g.v!==S.lastV){
        S.lastV=g.v; S.g=g;
        if(g.phase==='lobby'){ if(S.lastPhase&&S.lastPhase!=='lobby') resetView(); S.lastPhase='lobby'; renderLobby(); }
        else renderGame(g);
      } else if(!S.g||S.g.phase==='lobby') renderLobby();
    }
  }
}

  if(!S.nr) return [];

}

}
